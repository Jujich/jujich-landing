workflow:
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - when: never

stages:
  - build
  - deploy

default:
  tags:
    - jujich-landing
  interruptible: true

variables:
  NUXT_TELEMETRY_DISABLED: '1'
  npm_config_cache: '$CI_PROJECT_DIR/.npm'
  FF_GIT_URLS_WITHOUT_TOKENS: 'true'

build:
  stage: build
  cache:
    key:
      files:
        - package-lock.json
    paths:
      - .npm/
  script:
    - node -e 'const [major, minor] = process.versions.node.split(".").map(Number); if (major < 24 || (major === 24 && minor < 11)) throw new Error("Node.js >=24.11 required")'
    - npm ci --no-audit --no-fund
    - npm run typecheck
    - npm test
    - npm run generate
    - test -s .output/public/index.html
  artifacts:
    paths:
      - .output/public/
    expire_in: 7 days

deploy:
  stage: deploy
  needs:
    - job: build
      artifacts: true
  resource_group: production
  interruptible: false
  environment:
    name: production
    url: https://jujich.dev
  script:
    - bash ops/deploy.sh "$CI_PROJECT_DIR/.output/public" "$CI_COMMIT_SHA-$CI_PIPELINE_ID"
