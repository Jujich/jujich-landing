# kserver gateway: HTTPS for jujich.dev, static content on 192.168.98.14.
server {
    listen 80;
    listen [::]:80;
    server_name jujich.dev www.jujich.dev;
    location / {
        return 301 https://jujich.dev$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.jujich.dev;
    ssl_certificate /etc/letsencrypt/live/jujich.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/jujich.dev/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    return 301 https://jujich.dev$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name jujich.dev;
    server_tokens off;
    ssl_certificate /etc/letsencrypt/live/jujich.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/jujich.dev/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    add_header Strict-Transport-Security "max-age=31536000" always;

    location / {
        proxy_pass http://192.168.98.14:80;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }
}
