# Gateway: kserver (192.168.98.12), public NAT 82.208.85.23.
# Certbot adds the HTTPS configuration after public DNS points to this gateway.
server {
    listen 80;
    listen [::]:80;
    server_name jujich.dev www.jujich.dev;
    server_tokens off;

    location / {
        proxy_pass http://192.168.98.14:80;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }
}
