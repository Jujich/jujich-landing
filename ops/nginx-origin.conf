# Origin: 192.168.98.14. HTTPS terminates at the existing kserver gateway.
server {
    listen 80;
    listen [::]:80;
    server_name jujich.dev www.jujich.dev;
    root /var/www/jujich.dev/current;
    index index.html;
    charset utf-8;
    server_tokens off;
    # TLS terminates on the gateway; keep directory redirects relative.
    absolute_redirect off;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "DENY" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Cache-Control "no-cache" always;

    location ^~ /.well-known/ {
        default_type text/plain;
        add_header Cache-Control "no-store" always;
        try_files $uri =404;
    }

    location ^~ /_nuxt/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # Nuxt's canonical RU route has no trailing slash.
    location = /ru {
        try_files /ru/index.html =404;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    location ~ /\. {
        deny all;
    }
}
